[program:netconman]
command=/usr/bin/python3 /home/space/.supervisor/netconman.py
directory=/home/space/.supervisor
user=space
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/netconman_supervisor.out.log
stderr_logfile=/var/log/netconman_supervisor.err.log
