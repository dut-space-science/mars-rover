<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mars Rover Control Center</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2230; --accent:#e8710a; --text:#e6edf3; --muted:#8b98a9; }
  * { box-sizing:border-box; margin:0; font-family:system-ui,sans-serif; }
  body { background:var(--bg); color:var(--text); }
  nav { display:flex; gap:4px; background:var(--panel); padding:0 20px; }
  nav button { background:none; border:none; color:var(--muted); padding:12px 18px; cursor:pointer; border-bottom:3px solid transparent; font-size:.95rem; }
  nav button.active { color:var(--text); border-bottom-color:var(--accent); }
  main { padding:20px; max-width:900px; margin:0 auto; }
  .tab { display:none; } .tab.active { display:block; }
  .card { background:var(--panel); border-radius:10px; padding:18px; margin-bottom:16px; }
  .card h2 { font-size:1rem; margin-bottom:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  label { display:block; margin:10px 0 4px; color:var(--muted); font-size:.85rem; }
  input, select { width:100%; padding:9px 12px; border-radius:6px; border:1px solid #2c3a4d; background:var(--bg); color:var(--text); }
  button.primary { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:10px 18px; cursor:pointer; margin-top:12px; }
  button.ghost { background:none; border:1px solid #2c3a4d; color:var(--text); border-radius:6px; padding:8px 14px; cursor:pointer; margin:4px 4px 0 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  .stat { background:var(--bg); border-radius:8px; padding:14px; }
  .stat .v { font-size:1.5rem; font-weight:700; }
  .stat .k { color:var(--muted); font-size:.8rem; margin-top:4px; }
</style>
</head>
<body>
<nav>
  <button class="active" data-tab="controls">Controls</button>
  <button data-tab="camera">Camera</button>
  <button data-tab="settings">Settings</button>
  <button data-tab="analytics">Analytics</button>
</nav>
<main>

<section id="controls" class="tab active">
  <div class="card">
    <h2>Speed</h2>
    <input id="speed" type="range" min="0" max="100" value="50" oninput="document.getElementById('speed-v').textContent=this.value+'%'">
    <p style="text-align:center"><b id="speed-v">50%</b></p>
  </div>
  <div class="card">
    <h2>Drive</h2>
    <div style="text-align:center;line-height:2.2">
      <button class="ghost" onclick="drive('FORWARD')">Forward</button><br>
      <button class="ghost" onclick="drive('LEFT')">Left</button>
      <button class="ghost" onclick="drive('STOP')">Stop</button>
      <button class="ghost" onclick="drive('RIGHT')">Right</button><br>
      <button class="ghost" onclick="drive('BACKWARD')">Backward</button>
    </div>
  </div>
</section>

<section id="camera" class="tab">
  <div class="card">
    <h2>Camera</h2>
    <button class="ghost" onclick="post('/api/colordetect/motion/enable')">Start motion + detect</button>
    <button class="ghost" onclick="post('/api/colordetect/motion/disable')">Stop</button>
  </div>
</section>

<section id="settings" class="tab">
  <div class="card">
    <h2>Connection</h2>
    <label>API base URL</label>
    <input id="api-base" placeholder="http://10.42.0.97:8000">
    <button class="primary" onclick="saveSettings()">Save</button>
  </div>
  <div class="card">
    <h2>Color detection</h2>
    <button class="ghost" onclick="loadConfig()">Load current config</button>
    <label>min_area</label><input id="cfg-min-area" type="number">
    <label>jpeg_quality</label><input id="cfg-quality" type="number">
    <label>resize_width</label><input id="cfg-resize" type="number">
    <button class="primary" onclick="saveConfig()">Save config</button>
    <pre id="cfg-out" style="color:var(--muted);margin-top:10px;white-space:pre-wrap"></pre>
  </div>
  <div class="card">
    <h2>Services</h2>
    <div id="service-buttons"></div>
  </div>
</section>

<section id="analytics" class="tab">
  <div class="card">
    <h2>System</h2>
    <div class="grid">
      <div class="stat"><div class="v" id="a-cpu">–</div><div class="k">CPU %</div></div>
      <div class="stat"><div class="v" id="a-temp">–</div><div class="k">Temp °C</div></div>
      <div class="stat"><div class="v" id="a-ram">–</div><div class="k">RAM %</div></div>
      <div class="stat"><div class="v" id="a-disk">–</div><div class="k">Disk %</div></div>
      <div class="stat"><div class="v" id="a-wifi">–</div><div class="k">WiFi %</div></div>
      <div class="stat"><div class="v" id="a-up">–</div><div class="k">Uptime</div></div>
    </div>
  </div>
  <div class="card">
    <h2>Programs</h2>
    <pre id="a-programs" style="color:var(--muted);white-space:pre-wrap">–</pre>
  </div>
</section>

</main>
<script>
const $ = id => document.getElementById(id);
let apiBase = localStorage.getItem('apiBase') || 'http://10.42.0.97:8000';
$('api-base').value = apiBase;

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === b.dataset.tab));
});

function saveSettings() {
  apiBase = $('api-base').value.replace(/\/$/, '');
  localStorage.setItem('apiBase', apiBase);
  setStatus('saved');
}
function setStatus(s) { console.log(s); }
async function post(path, body) {
  try {
    const r = await fetch(apiBase + path, {method:'POST', headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : '{}'});
    setStatus(path + ' -> ' + r.status);
    return r.json();
  } catch (e) { setStatus('error: ' + e.message); }
}
async function get(path) {
  const r = await fetch(apiBase + path);
  return r.json();
}

function drive(dir) {
  const s = +$('speed').value;
  post('/api/pico/command', {cmd: dir + ' ' + s});
}
const SERVICES = ['colordetect','netconman','picocoms','motion','websockify','control-api'];
$('service-buttons').innerHTML = SERVICES.map(s =>
  `<button class="ghost" onclick="post('/api/services/${s}/start')">${s} start</button>
   <button class="ghost" onclick="post('/api/services/${s}/stop')">${s} stop</button><br>`).join('');

async function loadConfig() {
  const c = await get('/api/colordetect/config');
  $('cfg-min-area').value = c.min_area; $('cfg-quality').value = c.jpeg_quality; $('cfg-resize').value = c.resize_width;
  $('cfg-out').textContent = JSON.stringify(c.colours, null, 2);
}
async function saveConfig() {
  await post('/api/colordetect/config', {min_area:+$('cfg-min-area').value, jpeg_quality:+$('cfg-quality').value, resize_width:+$('cfg-resize').value});
}

async function pollAnalytics() {
  try {
    const s = await get('/api/system');
    $('a-cpu').textContent = s.cpu_percent; $('a-temp').textContent = s.cpu_temp_c;
    $('a-ram').textContent = s.memory.percent; $('a-disk').textContent = s.disk.percent;
    $('a-wifi').textContent = s.wifi ? s.wifi.signal_percent : '–';
    $('a-up').textContent = Math.round(s.uptime_s/60) + 'm';
    const st = await get('/api/status');
    $('a-programs').textContent = Object.entries(st.programs).map(([k,v]) => k + ': ' + v).join('\n');
    setStatus('connected');
  } catch (e) { setStatus('disconnected'); }
}
setInterval(pollAnalytics, 3000); pollAnalytics();
</script>
</body>
</html>
