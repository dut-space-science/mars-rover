[program:picocoms]
command=/usr/bin/python3 /home/space/.supervisor/picocoms.py
directory=/home/space/.supervisor
user=space
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/picocoms_supervisor.out.log
stderr_logfile=/var/log/picocoms_supervisor.err.log
